<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8F7">
<title>富士・東京 8 日｜旅行手帳</title>
<meta property="og:title" content="富士・東京 8 日旅行手帳">
<meta property="og:description" content="2027/2/16–2/23 河口湖 2 泊＋新宿 5 泊">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: airy travel notebook — pale sage page, white cards, one mint accent, sky blue for transport, peach only for warnings. Single theme by choice. */
:root{
  --bg:#F6F8F7; --card:#FFFFFF; --ink:#24312D; --muted:#6B7874; --line:#E2E8E5;
  --mint:#3B9781; --mint-l:#E3F2ED; --sky:#4F8FCB; --sky-l:#E7F0F9; --peach:#D9735B; --peach-l:#FCECE7; --sun:#F2C55C;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --latin:"Quicksand","Noto Sans TC",system-ui,sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:700}
img{max-width:100%;display:block}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums;font-family:var(--latin)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(246,248,247,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:10px;height:52px}
.brand{font-weight:700;font-size:16px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;display:inline-block;background:var(--mint);clip-path:polygon(50% 8%,100% 92%,0 92%);border-radius:2px}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#C9D2CE}
.sync.ok::before{background:var(--mint)}
.sync.warn::before{background:var(--peach)}

/* sections */
section.view{display:none;padding:18px 0 32px}
section.view.on{display:block}
.sh{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sh h2{font-size:19px}
.sh .en{font-family:var(--latin);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sh .act{margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:540px){.grid2{grid-template-columns:1fr}}

/* chips & buttons */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:#EEF2F0;color:var(--muted);white-space:nowrap;line-height:1.6}
.chip.mint{background:var(--mint-l);color:var(--mint)}
.chip.sky{background:var(--sky-l);color:var(--sky)}
.chip.peach{background:var(--peach-l);color:var(--peach)}
.chip.sun{background:#FBF1D8;color:#9A7417}
.btn{border:0;background:var(--mint);color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn svg{width:16px;height:16px}
.ibtn{border:1px solid var(--line);background:#fff;padding:4px 9px;border-radius:999px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.ibtn svg{width:14px;height:14px}
.ibtn:hover{border-color:var(--mint);color:var(--mint)}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn.armed{background:var(--peach);border-color:var(--peach);color:#fff}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--sky);text-decoration:none}
.lnk:hover{text-decoration:underline}
.lnk svg{width:14px;height:14px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}

/* hero */
.hero{border-radius:22px;overflow:hidden;position:relative;background:#DDE9F2}
.hero img{width:100%;height:230px;object-fit:cover}
.hero .ov{position:absolute;inset:auto 0 0 0;padding:56px 18px 16px;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.92) 55%,#fff 100%)}
.hero h1{font-size:28px;letter-spacing:.02em}
.hero .d{font-family:var(--latin);font-weight:600;color:var(--muted);font-size:14px}
.cd{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.cd b{font-family:var(--latin);font-size:34px;color:var(--mint);line-height:1}
.credit{font-size:10.5px;color:var(--muted);padding:6px 2px 0}
.credit a{color:var(--muted)}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.quick a{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;text-decoration:none;font-size:12.5px;display:grid;justify-items:center;gap:4px}
.quick a svg{width:22px;height:22px;color:var(--mint)}

/* day overview */
.dlist{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;width:100%}
.drow:hover{border-color:var(--mint)}
.drow .n{font-family:var(--latin);font-weight:700;color:var(--mint);font-size:13px;line-height:1.1;text-align:center}
.drow .n b{display:block;font-size:22px}
.drow .t{font-weight:700;font-size:15px}
.drow .s{font-size:12.5px;color:var(--muted)}

/* flight */
.flight{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.flight .ap b{font-family:var(--latin);font-size:28px;display:block;line-height:1.1}
.flight .ap span{font-size:12px;color:var(--muted)}
.flight .ap .tm{font-family:var(--latin);font-weight:700;font-size:17px;color:var(--ink)}
.flight .mid{text-align:center;font-size:12px;color:var(--muted)}
.flight .mid svg{width:20px;height:20px;color:var(--sky)}
.r{text-align:right}
.fhead{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.fhead strong{font-size:15px}
table.bag{width:100%;border-collapse:collapse;font-size:13.5px}
table.bag th,table.bag td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.bag th{font-weight:500;color:var(--muted);white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:10px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.callout{background:var(--sky-l);border-radius:12px;padding:10px 12px;font-size:13.5px}
.callout.peach{background:var(--peach-l)}
.callout.mint{background:var(--mint-l)}

/* itinerary */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;cursor:pointer;text-align:center;min-width:64px}
.tab b{display:block;font-family:var(--latin);font-size:14px}
.tab span{font-size:11.5px;color:var(--muted)}
.tab.on{background:var(--mint);border-color:var(--mint);color:#fff}
.tab.on span{color:#E3F2ED}
.dayh{margin:6px 0 12px}
.dayh .en{font-family:var(--latin);font-size:12px;color:var(--muted);letter-spacing:.06em}
.dayh h2{font-size:22px;margin:2px 0 6px}
.dayh p{margin:0;font-size:14px;color:var(--muted)}

.map{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#EEF2F0;aspect-ratio:720/440}
.map img{width:100%;height:100%;object-fit:cover;filter:saturate(.55) brightness(1.05) contrast(.95)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .att{position:absolute;right:6px;bottom:4px;font-size:10px;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:6px;color:var(--muted)}
.map .att a{color:var(--muted)}
.pin circle{fill:var(--mint);stroke:#fff;stroke-width:2.5}
.pin.food circle{fill:var(--peach)}
.pin.hotel circle{fill:var(--sky)}
.pin text{fill:#fff;font:700 12px var(--latin);text-anchor:middle;dominant-baseline:central}
.pin{cursor:pointer}

.stops{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.stop{display:grid;grid-template-columns:30px 1fr;gap:10px}
.stop .no{width:30px;height:30px;border-radius:50%;background:var(--mint);color:#fff;font:700 13px var(--latin);display:grid;place-items:center;margin-top:12px}
.stop .no.food{background:var(--peach)}
.stop .no.hotel,.stop .no.move{background:var(--sky)}
.stop .no.off{background:#C9D2CE}
.sc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sc .ph{aspect-ratio:16/8;background:#EEF2F0}
.sc .ph img{width:100%;height:100%;object-fit:cover}
.sc .in{padding:12px 14px}
.sc .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sc .tm{font-family:var(--latin);font-weight:700;color:var(--mint);font-size:14px}
.sc h3{font-size:16px;flex:1 1 200px}
.sc .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sc .note{font-size:14px;margin-top:6px}
.sc .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.sc .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.sc .tools .sp{flex:1}
.cap{font-size:10.5px;color:var(--muted);padding:4px 14px 0}
.cap a{color:var(--muted)}
.musteat{background:#FFF8EE;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13.5px}
.musteat b{color:#9A7417;font-size:12px;display:block;margin-bottom:2px}
.musteat ul{margin:0;padding-left:18px}
.sea{background:var(--peach-l);color:#8E3E2B;border-radius:10px;padding:7px 10px;margin-top:8px;font-size:13px}

/* places */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.fb{border:1px solid var(--line);background:#fff;padding:5px 12px;font-size:13px;cursor:pointer;border-radius:999px}
.fb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{width:100%;border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:12px}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:540px){.plist{grid-template-columns:1fr}}
.pc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pc .ph{aspect-ratio:16/9;background:#EEF2F0;position:relative}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .ph .lbl{position:absolute;left:8px;bottom:8px;font-size:11px;background:rgba(255,255,255,.9);padding:1px 8px;border-radius:999px;color:var(--muted)}
.pc .noph{display:grid;place-items:center;color:#B8C4BF}
.pc .noph svg{width:40px;height:40px}
.pc .in{padding:12px 14px;display:grid;gap:6px;flex:1;align-content:start}
.pc .hd{display:flex;gap:8px;align-items:flex-start}
.pc h3{font-size:15.5px;flex:1;line-height:1.4}
.pc h3 small{display:block;font-family:var(--latin);font-weight:500;font-size:12px;color:var(--muted)}
.heart{border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;color:#B8C4BF}
.heart svg{width:17px;height:17px}
.heart.on{color:#fff;background:var(--peach);border-color:var(--peach)}
.pc .d{font-size:13.5px}
.pc .m{font-size:12.5px;color:var(--muted)}
.mine-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);display:inline-block}

/* lists */
.prog{height:8px;border-radius:99px;background:#E6ECE9;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--mint);border-radius:99px}
.tg{margin-bottom:14px}
.tg h3{font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:6px;letter-spacing:.04em}
.ti{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px}
.ti input[type=checkbox]{width:19px;height:19px;accent-color:var(--mint);flex:0 0 auto}
.ti label{flex:1;font-size:14px}
.ti.done label{color:var(--muted);text-decoration:line-through}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.addrow input,.addrow select{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:10px;min-width:0}
.addrow input{flex:1 1 160px}

/* cost */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{display:block;font-family:var(--latin);font-size:22px}
.tile.hl{background:var(--mint);border-color:var(--mint);color:#fff}
.tile.hl span{color:#DFF1EB}
@media (max-width:480px){.tiles{grid-template-columns:1fr 1fr}.tile.hl{grid-column:1/-1}}
.settings{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 6px}
.settings label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.settings input{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:10px;width:140px;color:var(--ink)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:64px 1fr 96px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:#E6ECE9;border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--sky);border-radius:99px}
.bar .v{text-align:right}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);font-size:12px}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.cform{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-top:10px}
.cform input,.cform select{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:10px;min-width:0}
.cform .full{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13.5px}
@media (max-width:540px){.cform{grid-template-columns:1fr 1fr}}

/* allergy */
.seg{display:inline-flex;background:#E9EEEC;border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 16px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:700}
.acard{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.phrase{font-size:17px;line-height:1.7}
.phrase small{display:block;font-size:13px;color:var(--muted)}
.full{position:fixed;inset:0;background:#fff;z-index:60;display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.full.on{display:flex}
.full img{max-width:100%;max-height:100%;object-fit:contain}

/* nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bn .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
nav.bn a{display:grid;justify-items:center;gap:1px;padding:8px 0 8px;color:#98A39F;text-decoration:none;font-size:11px}
nav.bn a svg{width:22px;height:22px}
nav.bn a.on{color:var(--mint);font-weight:700}

/* modal */
.modal{position:fixed;inset:0;background:rgba(36,49,45,.35);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:600px;max-height:88%;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0}
.sheet h3{font-size:18px;margin-bottom:12px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form textarea,.form select{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;color:var(--ink)}
.form textarea{min-height:72px;resize:vertical}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .chk{display:flex;align-items:center;gap:8px;color:var(--ink)}
.form .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:70;display:none}
.toast.on{display:block}
.empty{border:1px dashed #C9D2CE;border-radius:14px;padding:20px;text-align:center;color:var(--muted);font-size:14px}
.hist{display:grid;gap:6px;margin-top:8px}
.hist .ti{font-size:13px}
@media (prefers-reduced-motion:no-preference){.sc,.pc,.drow{transition:border-color .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><i aria-hidden="true"></i>富士・東京 8 日</div>
  <div class="sync" id="sync">連線中…</div>
</div></header>

<main class="wrap">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-explore"></section>
  <section class="view" id="v-food"></section>
  <section class="view" id="v-list"></section>
  <section class="view" id="v-cost"></section>
  <section class="view" id="v-card"></section>
</main>

<nav class="bn" aria-label="主要分頁"><div class="in" id="nav"></div></nav>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><div class="sheet" id="sheet"></div></div>
<div class="full" id="full" role="dialog" aria-label="過敏字卡全螢幕"><img id="fullimg" alt=""></div>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script>
(function(){
'use strict';
var D=window.TRIP_DATA,PH=window.TRIP_PHOTOS||{};
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var clone=function(o){return JSON.parse(JSON.stringify(o));};
var uid=function(){return Math.random().toString(36).slice(2,9);};
var CM='https://commons.wikimedia.org/wiki/File:';

var IC={
 home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',
 route:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/>',
 bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',

/* ---------- map ---------- */
function wx(lng,z){return (lng+180)/360*256*Math.pow(2,z);}
function wy(lat,z){var s=Math.sin(lat*Math.PI/180);return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*Math.pow(2,z);}
function kindOf(s){return s.food?'food':(s.ic==='hotel'?'hotel':((s.ic==='bus'||s.ic==='train'||s.ic==='plane')?'move':''));}
function mapHtml(key,pts,label){
  var m=D.MAPS[key];if(!m)return '';
  var g='',line=[];
  pts.forEach(function(p){if(!p.ll)return;var x=wx(p.ll[1],m.z)-m.x0,y=wy(p.ll[0],m.z)-m.y0;if(x<-10||y<-10||x>m.w+10||y>m.h+10)return;p._xy=[x,y];if(p.route)line.push(x.toFixed(1)+','+y.toFixed(1));});
  if(line.length>1)g+='<polyline points="'+line.join(' ')+'" fill="none" stroke="#3B9781" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" opacity=".75"/>';
  var seen={};
  pts.forEach(function(p){if(!p._xy)return;var k=p._xy[0].toFixed(0)+','+p._xy[1].toFixed(0),off=(seen[k]||0)*14;seen[k]=(seen[k]||0)+1;
    g+='<g class="pin '+(p.cls||'')+'" data-go="'+esc(p.id)+'" transform="translate('+(p._xy[0]+off).toFixed(1)+' '+p._xy[1].toFixed(1)+')"><title>'+esc(p.title)+'</title><circle r="12"/><text>'+esc(p.label)+'</text></g>';});
  return '<div class="map"><img src="img/map/'+key+'.jpg" alt="'+esc(label)+'地圖" loading="lazy"><svg viewBox="0 0 '+m.w+' '+m.h+'" role="img" aria-label="'+esc(label)+'的位置">'+g+'</svg>'+
    '<div class="att">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div></div>';
}

function geocode(q,center,cb){
  try{fetch('https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&lat='+center[0]+'&lon='+center[1]+'&limit=1').then(function(r){return r.json();}).then(function(j){
    var f=j.features&&j.features[0];if(!f)return cb(null);var c=[f.geometry.coordinates[1],f.geometry.coordinates[0]];
    if(Math.abs(c[0]-center[0])>0.6||Math.abs(c[1]-center[1])>0.8)return cb(null);cb(c);}).catch(function(){cb(null);});}catch(e){cb(null);}
}

   '<div class="sh"><h2>同步與版本</h2><span class="en">Sync</span></div><div class="card"><p class="small" style="margin:0 0 10px">行程、待辦、費用和新增的店家是兩人共用的，任何人改了另一個人會即時看到。收藏和打包清單只存在各自的手機。</p>'+
   '<div class="addrow" style="margin:0"><input id="nm" placeholder="你的名字（顯示在版本紀錄）" value="'+esc(LOCAL.name)+'" aria-label="你的名字"><button class="btn ghost" id="nm-s">儲存名字</button></div>'+
   '<div style="margin-top:14px"><b class="small">版本紀錄</b><p class="small muted" style="margin:2px 0 0">每次修改會自動存一份，保留最近 6 份。改錯了可以回到之前的版本。</p><div class="hist" id="hist"><div class="small muted">載入中…</div></div></div></div>';
  $$('[data-td]').forEach(function(c){c.onchange=function(){var t=S.todos.filter(function(x){return x.id===c.dataset.td;})[0];t.done=c.checked;persist();rList();};});
  $$('[data-tdel]').forEach(function(b){b.onclick=function(){armDelete(b,function(){S.todos=S.todos.filter(function(x){return x.id!==b.dataset.tdel;});persist();rList();});};});
  $$('[data-pk]').forEach(function(c){c.onchange=function(){LOCAL.pack['p'+c.dataset.pk]=c.checked;saveLocal();rList();};});
  $('#tadd').onsubmit=function(e){e.preventDefault();var v=$('#t-t').value.trim();if(!v)return;S.todos.push({id:'t'+uid(),g:$('#t-g').value,t:v,u:'',done:false});persist();rList();};
  $('#nm-s').onclick=function(){LOCAL.name=$('#nm').value.trim();saveLocal();toast('已儲存');};
  loadHist();
}
function loadHist(){
  var el=$('#hist');if(!el)return;
  if(!href){el.innerHTML='<div class="small muted">還沒連上雲端。</div>';return;}
  href.get().then(function(d){var list=histList(d);if(!$('#hist'))return;
    if(!list.length){$('#hist').innerHTML='<div class="small muted">還沒有紀錄。</div>';return;}
    $('#hist').innerHTML=list.map(function(h,i){var dt=new Date(h.t);return '<div class="ti"><label>'+(dt.getMonth()+1)+'/'+dt.getDate()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')+'・'+esc(h.by||'某人')+'</label><button class="ibtn" data-rs="'+i+'">回到這版</button></div>';}).join('');
    $$('[data-rs]').forEach(function(b){b.onclick=function(){armDelete(b,function(){var h=list[+b.dataset.rs];try{S=JSON.parse(h.data);persist();toast('已回到這個版本');render();}catch(e){}},'再按一次確認');};});
  }).catch(function(){if($('#hist'))$('#hist').innerHTML='<div class="small muted">讀不到版本紀錄。</div>';});
}

/* ---------- COST ---------- */
function toTWD(c){var a=+c.amt||0;if(c.cur==='JPY')a*=(+S.set.rate||0);if(c.per)a*=(+S.set.people||1);return a;}
function rCost(){
  var tot=0,by={};S.costs.forEach(function(c){var v=toTWD(c);tot+=v;by[c.cat]=(by[c.cat]||0)+v;});
  var ppl=+S.set.people||1,est=S.costs.filter(function(c){return c.est;}).length,cats=Object.keys(by).sort(function(a,b){return by[b]-by[a];}),mx=Math.max.apply(null,cats.map(function(k){return by[k];}).concat([1]));
  $('#v-cost').innerHTML='<div class="sh" style="margin-top:4px"><h2>旅費</h2><span class="en">兩人共用</span></div>'+
   '<div class="tiles"><div class="tile hl"><span>總計（台幣）</span><b>NT$'+fmt(tot)+'</b></div><div class="tile"><span>每人</span><b>NT$'+fmt(tot/ppl)+'</b></div><div class="tile"><span>筆數／估價</span><b>'+S.costs.length+' / '+est+'</b></div></div>'+
   '<div class="settings"><label for="s-p">人數<input id="s-p" type="number" min="1" value="'+esc(S.set.people)+'"></label><label for="s-r">匯率（1 日圓 = ? 台幣）<input id="s-r" type="number" step="0.0001" min="0" value="'+esc(S.set.rate)+'"></label></div>'+
   '<p class="small muted" style="margin:0 0 6px">匯率預設 0.20（2026 年中台銀牌告的大約數字），換錢前改成當天的。</p>'+
   '<div class="sh"><h2 style="font-size:16px">依類別</h2></div><div class="bars">'+cats.map(function(k){return '<div class="bar"><span>'+esc(k)+'</span><div class="tr"><i style="width:'+(by[k]/mx*100)+'%"></i></div><span class="v num">NT$'+fmt(by[k])+'</span></div>';}).join('')+'</div>'+
   '<div class="sh"><h2 style="font-size:16px">明細</h2></div><div class="tbl"><table><thead><tr><th>項目</th><th>日期</th><th class="r">金額</th><th class="r">台幣</th><th></th></tr></thead><tbody>'+
   S.costs.map(function(c){return '<tr><td><b>'+esc(c.n)+'</b><div class="links" style="gap:4px;margin-top:2px"><span class="chip">'+esc(c.cat)+'</span>'+(c.per?'<span class="chip sky">每人</span>':'')+(c.est?'<span class="chip peach">估價</span>':'')+'</div>'+(c.memo?'<div class="small muted">'+esc(c.memo)+'</div>':'')+'</td>'+
    '<td class="num">'+esc(c.date||'—')+'</td><td class="r num">'+(c.cur==='JPY'?'¥':'NT$')+fmt(c.amt)+(c.per?' ×'+ppl:'')+'</td><td class="r num">'+fmt(toTWD(c))+'</td><td><button class="ibtn" data-cdel="'+c.id+'" aria-label="刪除 '+esc(c.n)+'">'+ic('trash')+'</button></td></tr>';}).join('')+'</tbody></table></div>'+
   '<div class="sh"><h2 style="font-size:16px">新增費用</h2></div><form class="cform" id="cf"><input id="c-n" placeholder="項目" aria-label="項目" required><select id="c-cat" aria-label="類別">'+['餐飲','交通','門票','購物','住宿','機票','其他'].map(function(x){return '<option>'+x+'</option>';}).join('')+'</select>'+
   '<input id="c-d" placeholder="日期 2/19" aria-label="日期"><input id="c-a" type="number" min="0" placeholder="金額" aria-label="金額" required>'+
   '<div class="full"><select id="c-cur" aria-label="幣別" style="border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff"><option value="JPY">日圓</option><option value="TWD">台幣</option></select><label><input type="checkbox" id="c-per"> 每人計價</label><label><input type="checkbox" id="c-est"> 估價</label><button class="btn" type="submit">加入</button></div></form>';
  var sp=$('#s-p'),sr=$('#s-r');
  sp.onchange=function(){var v=Math.max(1,parseInt(sp.value,10)||1);if(v!==S.set.people){S.set.people=v;persist();rCost();}};
  sr.onchange=function(){var v=parseFloat(sr.value);if(v>0&&v!==S.set.rate){S.set.rate=v;persist();rCost();}};
  $$('[data-cdel]').forEach(function(b){b.onclick=function(){armDelete(b,function(){S.costs=S.costs.filter(function(c){return c.id!==b.dataset.cdel;});persist();rCost();});};});
  $('#cf').onsubmit=function(e){e.preventDefault();var nm=$('#c-n').value.trim(),a=parseFloat($('#c-a').value);if(!nm||!(a>=0))return;
    S.costs.push({id:'c'+uid(),n:nm,cat:$('#c-cat').value,date:$('#c-d').value.trim(),amt:a,cur:$('#c-cur').value,per:$('#c-per').checked?1:0,est:$('#c-est').checked?1:0,memo:''});persist();rCost();toast('已加入');};
}

/* ---------- CARD ---------- */
function rCard(){
  var ja=LOCAL.lang!=='zh',src='img/allergy-'+(ja?'ja':'zh')+'.jpg';
  $('#v-card').innerHTML='<div class="sh" style="margin-top:4px"><h2>海藻過敏字卡</h2><span class="act"><span class="seg" role="group" aria-label="字卡語言"><button data-l="ja" class="'+(ja?'on':'')+'">日本語</button><button data-l="zh" class="'+(!ja?'on':'')+'">中文</button></span></span></div>'+
   '<p class="small muted" style="margin:-4px 0 10px">點圖片可以全螢幕，橫拿手機看得最清楚。給日本店員看日文版。</p>'+
   '<div class="acard" id="acard"><img src="'+src+'" alt="'+(ja?'日文過敏字卡：請不要在我的料理中加入海藻類':'中文過敏字卡：我的餐點請不要加入海藻類')+'"></div>'+
   '<div class="sh"><h2 style="font-size:16px">也可以直接說</h2></div><div class="stack">'+
   phrase('わかめや昆布など、海藻のアレルギーがあります。','我對海帶芽、昆布等海藻過敏。')+
   phrase('だし（出汁）に昆布は入っていますか？','高湯裡有用昆布嗎？')+
   phrase('海藻を抜いてもらえますか？','可以幫我不要放海藻嗎？')+
   phrase('味噌汁にわかめは入っていますか？','味噌湯裡有海帶芽嗎？')+
   '</div><div class="card" style="margin-top:12px"><b class="small">聽懂店員的回答</b><dl class="kv"><dt>入っています</dt><dd>有放</dd><dt>入っていません</dt><dd>沒有放</dd><dt>抜けます</dt><dd>可以拿掉</dd><dt>抜けません</dt><dd>沒辦法拿掉</dd><dt>大丈夫です</dt><dd>沒問題（沒有放）</dd></dl></div>'+
   '<div class="callout peach" style="margin-top:12px">常見藏有海藻的地方：日式高湯（昆布だし）、味噌湯的海帶芽、拉麵上的海苔、沙拉、佃煮、飯糰海苔、湯豆腐。海苔也是海藻，有需要的話一併請店家拿掉。</div>';
  $$('#v-card [data-l]').forEach(function(b){b.onclick=function(){LOCAL.lang=b.dataset.l;saveLocal();rCard();};});
  $('#acard').onclick=function(){$('#fullimg').src=src;$('#fullimg').alt=$('#acard img').alt;$('#full').classList.add('on');};
}
function phrase(jp,zh){return '<div class="card phrase">'+esc(jp)+'<small>'+esc(zh)+'</small></div>';}

/* ---------- boot ---------- */
route();
connect();
})();
</script>
</body>
</html>
