<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9BB7D4">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>富士・東京 8 日｜旅行手帳</title>
<meta property="og:title" content="富士・東京 8 日旅行手帳">
<meta property="og:description" content="2027/2/16–2/23 河口湖 2 泊＋新宿 5 泊">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: Pantone notebook — Sand Dollar 13-1106 page, white cards, Cerulean 15-4020 as the main fill, Aqua Sky 14-4811 for food and links;
   deeper shades of the same hues carry text so contrast holds. Peach only for warnings. Single theme by choice. */
:root{
  --cer:#9BB7D4; --aqua:#7BC4C4; --sand:#DECDBE; --sand-l:#F5EFE8;
  --cer-d:#5F8DBE; --aqua-d:#3B9C9C; --sand-d:#A88C74;
  --bg:#F5EFE8; --card:#FFFFFF; --ink:#22324A; --muted:#6E7682; --line:#E8DFD5;
  --mint:#3E6C9E; --mint-l:#E6EEF7; --sky:#2E8585; --sky-l:#E2F3F3; --peach:#C96A52; --peach-l:#FBEAE4; --sun:#F2C55C;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --latin:"Quicksand","Noto Sans TC",system-ui,sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:700}
img{max-width:100%;display:block}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums;font-family:var(--latin)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(245,239,232,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:10px;height:52px}
.brand{font-weight:700;font-size:16px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;display:inline-block;background:var(--cer-d);clip-path:polygon(50% 8%,100% 92%,0 92%);border-radius:2px}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#CFC4B8}
.sync.ok::before{background:var(--aqua-d)}
.sync.warn::before{background:var(--peach)}

/* sections */
section.view{display:none;padding:18px 0 32px}
section.view.on{display:block}
.sh{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sh h2{font-size:19px}
.sh .en{font-family:var(--latin);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sh .act{margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:540px){.grid2{grid-template-columns:1fr}}

/* chips & buttons */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:#F1EBE4;color:var(--muted);white-space:nowrap;line-height:1.6}
.chip.mint{background:var(--mint-l);color:var(--mint)}
.chip.sky{background:var(--sky-l);color:var(--sky)}
.chip.peach{background:var(--peach-l);color:var(--peach)}
.chip.sun{background:#FBF1D8;color:#9A7417}
.btn{border:0;background:var(--cer);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn svg{width:16px;height:16px}
.ibtn{border:1px solid var(--line);background:#fff;padding:4px 9px;border-radius:999px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.ibtn svg{width:14px;height:14px}
.ibtn:hover{border-color:var(--mint);color:var(--mint)}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn.armed{background:var(--peach);border-color:var(--peach);color:#fff}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--sky);text-decoration:none}
.lnk:hover{text-decoration:underline}
.lnk svg{width:14px;height:14px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}

/* hero */
.hero{border-radius:22px;overflow:hidden;position:relative;background:var(--sand)}
.hero img{width:100%;height:230px;object-fit:cover}
.hero .ov{position:absolute;inset:auto 0 0 0;padding:56px 18px 16px;background:linear-gradient(180deg,rgba(245,239,232,0) 0%,rgba(245,239,232,.94) 55%,#F5EFE8 100%)}
.hero h1{font-size:28px;letter-spacing:.02em}
.hero .d{font-family:var(--latin);font-weight:600;color:var(--muted);font-size:14px}
.cd{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.cd b{font-family:var(--latin);font-size:34px;color:var(--mint);line-height:1}
.credit{font-size:10.5px;color:var(--muted);padding:6px 2px 0}
.credit a{color:var(--muted)}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.quick a{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;text-decoration:none;font-size:12.5px;display:grid;justify-items:center;gap:4px}
.quick a svg{width:22px;height:22px;color:var(--mint)}

/* day overview */
.dlist{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;width:100%}
.drow:hover{border-color:var(--mint)}
.drow .n{font-family:var(--latin);font-weight:700;color:var(--mint);font-size:13px;line-height:1.1;text-align:center}
.drow .n b{display:block;font-size:22px}
.drow .t{font-weight:700;font-size:15px}
.drow .s{font-size:12.5px;color:var(--muted)}

/* flight */
.flight{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.flight .ap b{font-family:var(--latin);font-size:28px;display:block;line-height:1.1}
.flight .ap span{font-size:12px;color:var(--muted)}
.flight .ap .tm{font-family:var(--latin);font-weight:700;font-size:17px;color:var(--ink)}
.flight .mid{text-align:center;font-size:12px;color:var(--muted)}
.flight .mid svg{width:20px;height:20px;color:var(--sky)}
.r{text-align:right}
.fhead{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.fhead strong{font-size:15px}
table.bag{width:100%;border-collapse:collapse;font-size:13.5px}
table.bag th,table.bag td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.bag th{font-weight:500;color:var(--muted);white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:10px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.callout{background:var(--sky-l);border-radius:12px;padding:10px 12px;font-size:13.5px}
.callout.peach{background:var(--peach-l)}
.callout.mint{background:var(--mint-l)}

/* itinerary */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;cursor:pointer;text-align:center;min-width:64px}
.tab b{display:block;font-family:var(--latin);font-size:14px}
.tab span{font-size:11.5px;color:var(--muted)}
.tab.on{background:var(--cer);border-color:var(--cer);color:var(--ink)}
.tab.on span{color:var(--ink)}
.dayh{margin:6px 0 12px}
.dayh .en{font-family:var(--latin);font-size:12px;color:var(--muted);letter-spacing:.06em}
.dayh h2{font-size:22px;margin:2px 0 6px}
.dayh p{margin:0;font-size:14px;color:var(--muted)}

.map{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#EFE7DE;aspect-ratio:720/440}
.map img{width:100%;height:100%;object-fit:cover;filter:saturate(.55) brightness(1.05) contrast(.95)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .att{position:absolute;right:6px;bottom:4px;font-size:10px;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:6px;color:var(--muted)}
.map .att a{color:var(--muted)}
.pin circle{fill:var(--cer-d);stroke:#fff;stroke-width:2.5}
.pin.food circle{fill:var(--aqua-d)}
.pin.hotel circle{fill:var(--sand-d)}
.pin text{fill:#fff;font:700 12px var(--latin);text-anchor:middle;dominant-baseline:central}
.pin{cursor:pointer}

.stops{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.stop{display:grid;grid-template-columns:30px 1fr;gap:10px}
.stop .no{width:30px;height:30px;border-radius:50%;background:var(--cer-d);color:#fff;font:700 13px var(--latin);display:grid;place-items:center;margin-top:12px}
.stop .no.food{background:var(--aqua-d)}
.stop .no.hotel,.stop .no.move{background:var(--sand-d)}
.stop .no.off{background:#CFC4B8}
.sc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sc .ph{aspect-ratio:16/8;background:#EFE7DE}
.sc .ph img{width:100%;height:100%;object-fit:cover}
.sc .in{padding:12px 14px}
.sc .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sc .tm{font-family:var(--latin);font-weight:700;color:var(--mint);font-size:14px}
.sc h3{font-size:16px;flex:1 1 200px}
.sc .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sc .note{font-size:14px;margin-top:6px}
.sc .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.sc .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.sc .tools .sp{flex:1}
.cap{font-size:10.5px;color:var(--muted);padding:4px 14px 0}
.cap a{color:var(--muted)}
.musteat{background:#FFF8EE;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13.5px}
.musteat b{color:#9A7417;font-size:12px;display:block;margin-bottom:2px}
.musteat ul{margin:0;padding-left:18px}
.sea{background:var(--peach-l);color:#8E3E2B;border-radius:10px;padding:7px 10px;margin-top:8px;font-size:13px}

/* places */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.fb{border:1px solid var(--line);background:#fff;padding:5px 12px;font-size:13px;cursor:pointer;border-radius:999px}
.fb.on{background:var(--cer);border-color:var(--cer);color:var(--ink);font-weight:700}
.search{width:100%;border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:12px}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:540px){.plist{grid-template-columns:1fr}}
.pc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pc .ph{aspect-ratio:16/9;background:#EFE7DE;position:relative}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .ph .lbl{position:absolute;left:8px;bottom:8px;font-size:11px;background:rgba(255,255,255,.9);padding:1px 8px;border-radius:999px;color:var(--muted)}
.pc .noph{display:grid;place-items:center;color:#C9BBAC}
.pc .noph svg{width:40px;height:40px}
.pc .in{padding:12px 14px;display:grid;gap:6px;flex:1;align-content:start}
.pc .hd{display:flex;gap:8px;align-items:flex-start}
.pc h3{font-size:15.5px;flex:1;line-height:1.4}
.pc h3 small{display:block;font-family:var(--latin);font-weight:500;font-size:12px;color:var(--muted)}
.heart{border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;color:#C9BBAC}
.heart svg{width:17px;height:17px}
.heart.on{color:#fff;background:var(--peach);border-color:var(--peach)}
.pc .d{font-size:13.5px}
.pc .m{font-size:12.5px;color:var(--muted)}
.mine-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);display:inline-block}

/* lists */
.prog{height:8px;border-radius:99px;background:#EAE2D9;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--cer);border-radius:99px}
.tg{margin-bottom:14px}
.tg h3{font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:6px;letter-spacing:.04em}
.ti{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px}
.ti input[type=checkbox]{width:19px;height:19px;accent-color:var(--mint);flex:0 0 auto}
.ti label{flex:1;font-size:14px}
.ti.done label{color:var(--muted);text-decoration:line-through}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.addrow input,.addrow select{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:10px;min-width:0}
.addrow input{flex:1 1 160px}

/* cost */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{display:block;font-family:var(--latin);font-size:22px}
.tile.hl{background:var(--cer);border-color:var(--cer);color:var(--ink)}
.tile.hl span{color:var(--ink)}
@media (max-width:480px){.tiles{grid-template-columns:1fr 1fr}.tile.hl{grid-column:1/-1}}
.settings{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 6px}
.settings label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.settings input{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:10px;width:140px;color:var(--ink)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:64px 1fr 96px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:#EAE2D9;border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--aqua);border-radius:99px}
.bar .v{text-align:right}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);font-size:12px}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.cform{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-top:10px}
.cform input,.cform select{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:10px;min-width:0}
.cform .full{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13.5px}
@media (max-width:540px){.cform{grid-template-columns:1fr 1fr}}

/* allergy */
.seg{display:inline-flex;background:#ECE3D9;border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 16px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:700}
.acard{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.phrase{font-size:17px;line-height:1.7}
.phrase small{display:block;font-size:13px;color:var(--muted)}
.full{position:fixed;inset:0;background:#fff;z-index:60;display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.full.on{display:flex}
.full img{max-width:100%;max-height:100%;object-fit:contain}

/* nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bn .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
nav.bn a{display:grid;justify-items:center;gap:1px;padding:8px 0 8px;color:#9A9189;text-decoration:none;font-size:11px}
nav.bn a svg{width:22px;height:22px}
nav.bn a.on{color:var(--mint);font-weight:700}

/* modal */
.modal{position:fixed;inset:0;background:rgba(34,50,74,.35);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:600px;max-height:88%;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0}
.sheet h3{font-size:18px;margin-bottom:12px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form textarea,.form select{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;color:var(--ink)}
.form textarea{min-height:72px;resize:vertical}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .chk{display:flex;align-items:center;gap:8px;color:var(--ink)}
.form .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:70;display:none}
.toast.on{display:block}
.empty{border:1px dashed #D5C8BA;border-radius:14px;padding:20px;text-align:center;color:var(--muted);font-size:14px}
.hist{display:grid;gap:6px;margin-top:8px}
.hist .ti{font-size:13px}

/* cost v2 */
.costhero{background:var(--cer);border-radius:var(--r);padding:16px 18px;color:var(--ink)}
.costhero .lbl{font-size:13px}
.costhero .big{font-family:var(--latin);font-weight:700;font-size:36px;line-height:1.15}
.costhero .sub{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;margin-top:4px}
.costhero .split{height:8px;border-radius:99px;background:rgba(255,255,255,.55);overflow:hidden;margin-top:12px}
.costhero .split i{display:block;height:100%;background:var(--ink);border-radius:99px}
.settle{margin-top:10px;background:var(--sky-l);color:var(--sky);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700}
.settle b{font-size:18px}
.settle.ok{justify-content:flex-start}
.stackbar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:10px 0 8px;background:#EAE2D9}
.stackbar i{display:block;height:100%}
.legend{display:grid;gap:4px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend span b{margin-left:auto;font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.days{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:10px;align-items:end}
.dcol{display:grid;justify-items:center;gap:3px;font-size:10.5px;color:var(--muted)}
.dcol b{font-size:10px;font-weight:600;color:var(--ink);white-space:nowrap}
.dbar{width:100%;max-width:28px;height:70px;background:#F1EBE4;border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.dbar i{display:block;width:100%;background:var(--aqua);border-radius:6px 6px 0 0}
.cgroup{margin-bottom:12px}
.cgh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:0 4px 4px}
.crow{width:100%;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;text-align:left;cursor:pointer}
.crow:hover{border-color:var(--cer-d)}
.crow .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.crow .cn{flex:1;display:grid;min-width:0}
.crow .cn b{font-size:14.5px;font-weight:700}
.crow .cm{font-size:12px;color:var(--muted)}
.crow .ca{display:grid;justify-items:end;gap:2px;text-align:right}
.crow .ca b{font-size:14.5px}
details.card summary{cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"＋";float:right;color:var(--muted)}
details.card[open] summary::after{content:"－"}
.form .seg{flex-wrap:wrap;border-radius:14px}
.form .seg button{font-size:13.5px;padding:6px 12px;color:var(--ink)}
.rsv{display:grid;gap:6px}
.rsv .ti{gap:8px}
.rsv .ti label{flex:1}

/* v3: icons, uniform cards, nav */
.chip svg{width:13px;height:13px}
.shic{width:32px;height:32px;border-radius:10px;background:var(--mint-l);color:var(--mint);display:inline-grid;place-items:center;flex:0 0 auto;align-self:center}
.shic svg{width:18px;height:18px}
.sh{align-items:center}
.sic{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--mint-l);color:var(--mint);margin-right:6px;vertical-align:-4px}
.sic svg{width:14px;height:14px}
.star{color:#D9A520;margin-right:4px;font-size:.95em}
.sc .tm{display:inline-flex;align-items:center;gap:3px}
.sc .tm svg{width:14px;height:14px}
.mi{display:flex;gap:6px;align-items:flex-start}
.mi svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px;color:var(--mint)}
.mlist{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.musteat b{display:flex;align-items:center;gap:4px}
.musteat b svg{width:14px;height:14px}
.sea{display:flex;gap:6px;align-items:flex-start}
.sea svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px}
.tg h3{display:flex;align-items:center;gap:6px}
.tg h3 svg{width:15px;height:15px;color:var(--mint)}
.quick{grid-template-columns:repeat(4,1fr)}
.quick a{border-radius:16px;padding:12px 4px}
.quick a svg{width:24px;height:24px;color:var(--mint);background:var(--mint-l);padding:6px;border-radius:12px;box-sizing:content-box}
.wx{display:flex;gap:12px;align-items:flex-start}
.wx .shic{align-self:flex-start}
.callout.row-ic{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.callout.row-ic svg{width:18px;height:18px;flex:0 0 auto;color:var(--peach);margin-top:2px}
.lic,.cic{display:inline-grid!important;place-items:center;color:#fff;border-radius:8px!important}
.legend .lic{width:20px!important;height:20px!important}
.legend .lic svg{width:12px;height:12px}
.crow .cic{width:30px;height:30px;flex:0 0 auto}
.crow .cic svg{width:16px;height:16px}
/* search + filters */
.searchw{position:relative}
.searchw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.searchw .search{padding-left:38px;border-radius:999px}
.filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.fb{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex:0 0 auto}
.fb svg{width:15px;height:15px}
.fb.gold.on{background:#F6D77A;border-color:#F6D77A;color:var(--ink)}
.seg.big{display:flex;width:100%}
.seg.big button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 0;font-size:15px}
.seg.big svg{width:18px;height:18px}
/* uniform place grid */
.plist{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.plist{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pc{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:block}
.pcb{display:block;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit}
.pimg{aspect-ratio:4/3;background:var(--sand-l);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.pcb:hover .pimg img{transform:scale(1.04)}
.noph{display:grid;place-items:center;background:linear-gradient(135deg,var(--mint-l),var(--sky-l))}
.noph .bigic svg{width:44px;height:44px;color:var(--cer-d);opacity:.8}
.pin2{display:grid;gap:3px;padding:10px 12px 12px;min-height:72px}
.pin2 b{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.pk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk svg{width:13px;height:13px;flex:0 0 auto;color:var(--mint)}
.pc .heart{position:absolute;top:8px;right:8px;width:32px;height:32px;background:rgba(255,255,255,.92);border:0;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pc .heart.on{background:var(--peach);color:#fff}
.mine{position:absolute;top:8px;left:8px;background:#F6D77A;color:var(--ink);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pnum{position:absolute;left:8px;top:calc(75% * 1 - 30px);background:var(--cer-d);color:#fff;font:700 12px var(--latin);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff}
.pc .pnum{top:auto;bottom:auto}
.pcb{position:relative}
.pcb .pnum{position:absolute;left:8px;top:8px}
.pcb .mine~.pnum{top:36px}
/* detail sheet */
.dsheet .dimg{aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--sand-l);margin:-2px 0 6px}
.dsheet .dimg img{width:100%;height:100%;object-fit:cover}
.dsheet h3{font-size:19px;margin:10px 0 2px}
.bookc summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
.bookc summary::-webkit-details-marker{display:none}
.bookc summary::after{content:"＋";margin-left:auto;color:var(--muted)}
.bookc[open] summary::after{content:"－"}
.bookc .rsv{margin-top:12px}
.rsv .ti>svg{width:18px;height:18px;color:var(--mint);flex:0 0 auto}
/* bottom nav v3 */
nav.bn{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:0;border:0;border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 8px 24px rgba(34,50,74,.14),0 1px 2px rgba(34,50,74,.08)}
nav.bn .in{padding:6px 4px}
nav.bn a{padding:4px 0;gap:3px;font-size:10.5px;color:#8C8D93;border-radius:16px}
nav.bn a svg{width:21px;height:21px;padding:4px 12px;border-radius:999px;box-sizing:content-box;transition:background .2s}
nav.bn a.on{color:var(--ink)}
nav.bn a.on svg{background:var(--cer);color:var(--ink)}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
@media (max-width:380px){nav.bn a svg{padding:4px 8px}}

/* weather + tax */
.wp{display:grid;gap:8px;padding:6px 0 12px;border-bottom:1px dashed var(--line);margin-bottom:10px}
.wnow{display:flex;gap:10px;align-items:center}
.wic{width:40px;height:40px;border-radius:12px;background:var(--sky-l);color:var(--sky);display:grid;place-items:center}
.wic svg{width:24px;height:24px}
.wdays{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wd{background:var(--sand-l);border-radius:12px;padding:6px 4px;display:grid;justify-items:center;gap:2px;font-size:12px}
.wd svg{width:20px;height:20px;color:var(--cer-d)}
.wd b{font-size:15px}.wd .lo{color:var(--muted)}
.fuji .fh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fuji .fh svg{width:18px;height:18px;color:var(--mint)}
.fbars{display:grid;gap:6px}
.fb2{display:grid;padding:0;margin:0;grid-template-columns:52px 1fr 64px;gap:8px;align-items:center;font-size:13px}
.fb2 b{font-size:12.5px;text-align:right}
.ftrack{height:10px;border-radius:99px;background:#EAE2D9;overflow:hidden}
.ftrack i{display:block;height:100%;border-radius:99px}
.fb2.fv-g i{background:var(--aqua-d)}.fb2.fv-g b{color:var(--sky)}
.fb2.fv-m i{background:#E6B95A}.fb2.fv-m b{color:#9A7417}
.fb2.fv-b i{background:#C9A99A}.fb2.fv-b b{color:var(--muted)}
.dwx{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin:6px 0 8px;font-size:13.5px}
.dwx svg{width:18px;height:18px;color:var(--cer-d)}
.tstep .tsh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.tno{font:700 26px var(--latin);color:var(--cer);width:26px}
.tstep ol,.bad{margin:6px 0 8px;padding-left:22px;display:grid;gap:4px;font-size:14px}
.bad li::marker{color:var(--peach)}

/* v4 colorful */
:root{--pink:#E0728D;--pink-l:#FCE7EC;--yel:#C9931B;--yel-l:#FDF2D3;--grn:#3F9A63;--grn-l:#E2F4E8;--lil:#7A62C2;--lil-l:#EEE9FB;--blu:#3E6C9E;--blu-l:#E3EDF8;--red:#C9573F;--red-l:#FCE6E0}
.t-pink{--c:var(--pink);--cl:var(--pink-l)}.t-yel{--c:var(--yel);--cl:var(--yel-l)}.t-grn{--c:var(--grn);--cl:var(--grn-l)}.t-lil{--c:var(--lil);--cl:var(--lil-l)}.t-blu{--c:var(--blu);--cl:var(--blu-l)}.t-red{--c:var(--red);--cl:var(--red-l)}
.shic[class*=t-],.sic[class*=t-],.qi{background:var(--cl);color:var(--c)}
.qi{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;position:relative}
.qi svg{width:22px;height:22px}
.quick a{gap:6px}
.quick a .qi svg{width:22px!important;height:22px!important;background:none!important;padding:0!important;color:inherit!important}
.quick a:nth-child(8n+1){background:linear-gradient(160deg,#fff 55%,var(--grn-l))}.quick a:nth-child(8n+2){background:linear-gradient(160deg,#fff 55%,var(--lil-l))}
.quick a:nth-child(8n+3){background:linear-gradient(160deg,#fff 55%,var(--blu-l))}.quick a:nth-child(8n+4){background:linear-gradient(160deg,#fff 55%,var(--lil-l))}
.quick a:nth-child(8n+5){background:linear-gradient(160deg,#fff 55%,var(--pink-l))}.quick a:nth-child(8n+6){background:linear-gradient(160deg,#fff 55%,var(--grn-l))}
.quick a:nth-child(8n+7){background:linear-gradient(160deg,#fff 55%,var(--yel-l))}.quick a:nth-child(8n+8){background:linear-gradient(160deg,#fff 55%,var(--yel-l))}
.drow{grid-template-columns:58px 1fr auto}
.dth{width:58px;height:58px;border-radius:14px;overflow:hidden;position:relative;background:var(--sand-l)}
.dth img{width:100%;height:100%;object-fit:cover}
.dth span{position:absolute;left:4px;bottom:4px;background:#fff;color:var(--ink);font:700 12px var(--latin);min-width:20px;height:20px;border-radius:7px;display:grid;place-items:center;padding:0 4px}
.dlist .drow:nth-child(3n+1) .dth span{background:var(--yel-l)}.dlist .drow:nth-child(3n+2) .dth span{background:var(--pink-l)}.dlist .drow:nth-child(3n) .dth span{background:var(--grn-l)}
.bagt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bagt>div{background:var(--cl);border-radius:14px;padding:10px;display:grid;gap:2px;font-size:12.5px;color:var(--ink)}
.bagt svg{width:22px;height:22px;color:var(--c)}.bagt b{font-size:14.5px}.bagt span{color:var(--muted)}
.wi,.wic{color:var(--c)}.w-sun{--c:#E0A21B}.w-cloud{--c:#7C8DA6}.w-rain{--c:#3E7CC4}.w-snow{--c:#5AA7C9}
.wic{background:#FFF6DC}.wic.w-cloud{background:#EEF1F6}.wic.w-rain{background:#E3EDF8}.wic.w-snow{background:#E3F3F8}
.wd .wi svg{width:22px;height:22px;color:var(--c)}
.dwx .wi svg{color:var(--c)}
.fuji .fh svg.fujichan,.fujichan{width:60px;height:44px;flex:0 0 auto}
.fuji .fh{flex-wrap:nowrap}
.fgrid{display:grid;grid-template-columns:1fr 56px 56px;gap:6px 8px;align-items:center;justify-items:center;background:var(--sand-l);border-radius:14px;padding:10px 12px}
.fgrid .fl{justify-self:start;font-size:13.5px}.fgrid .fl.past{color:var(--muted)}.fgrid .fl i{font-style:normal;font-size:10.5px;margin-left:6px;background:#fff;border-radius:6px;padding:1px 5px}
.fdot{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:700 13px var(--latin);background:#EAE2D9;color:var(--muted)}
.fdot.hi{background:#5DBB9A;color:#fff}.fdot.md{background:#F4C95D;color:#5B4310}.fdot.lo{background:#E9B9C3;color:#7A3A4A}
.flegend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.flegend .fdot{width:20px;height:20px;font-size:10.5px;margin-left:6px}
.wxlinks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.wxlinks a{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:var(--ink);background:#fff;position:relative}
.wxlinks img{width:100%;aspect-ratio:16/9;object-fit:cover}
.wxlinks span{padding:8px 10px;display:grid;gap:2px}.wxlinks b{font-size:13.5px;display:flex;gap:4px;align-items:center}.wxlinks b svg{width:16px;height:16px;color:var(--cer-d)}
.wxlinks small{font-size:11.5px;color:var(--muted)}
.wxlinks a>svg{position:absolute;top:8px;right:8px;width:26px;height:26px;padding:5px;border-radius:50%;background:#fff;color:var(--ink);box-sizing:border-box}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:8px 0 10px}
.tiles.two{grid-template-columns:1fr 1fr}
.tile{background:var(--cl);border-radius:14px;padding:12px 8px;display:grid;justify-items:center;gap:6px;text-align:center;font-size:13px;font-weight:600}
.tile svg{width:26px;height:26px;color:var(--c)}
.flow{display:grid;gap:4px;margin:8px 0 10px}
.fstep{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.fstep small{display:block;color:var(--muted);font-size:12px}
.flow .arr{justify-self:center;color:var(--muted)}.flow .arr svg{width:16px;height:16px}
.nolist{display:grid;gap:8px}.nolist>div{display:flex;gap:10px;align-items:center;font-size:14px}
.nolist .qi{width:36px;height:36px}.nolist .qi svg{width:18px;height:18px}
.nolist .qi i{position:absolute;right:-4px;top:-4px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font:700 10px/16px var(--latin);text-align:center;font-style:normal}
.mine{min-width:28px;text-align:center}
.hero .ov h1{text-shadow:0 2px 12px rgba(0,0,0,.25)}
.sh h2{background:linear-gradient(transparent 62%,var(--cl,var(--sand-l)) 62%)}
.sh .shic+h2{--cl:inherit}

/* translator */
.tr{display:grid;gap:10px}
.trbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;font-weight:700}
.ibtn.round{width:36px;height:36px;padding:0;justify-content:center;border-radius:50%}
.ibtn svg{width:16px;height:16px}
.trin textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:17px;resize:vertical;background:var(--card);color:var(--ink)}
.trtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}.trtools .sp{flex:1}
.ibtn.mic{width:44px;height:44px;background:var(--red-l);color:var(--red);border-color:transparent}
.ibtn.mic svg{width:20px;height:20px}
.ibtn.mic.on{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(201,87,63,.15)}}
.trout{background:var(--blu-l);border-radius:12px;padding:12px}
.trres{font-size:22px;line-height:1.5;font-weight:700;word-break:break-word}
.trbig{font-size:34px;line-height:1.45;font-weight:700;word-break:break-word}
.trh{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:6px}
.trhh{display:flex;justify-content:space-between;align-items:center}
.tri{display:flex;gap:8px;align-items:center}
.trit{flex:1;text-align:left;border:0;background:var(--sand-l);border-radius:10px;padding:6px 10px;cursor:pointer;display:grid;font:inherit;color:var(--ink)}
.trit span{font-size:12px;color:var(--muted)}.trit b{font-size:14.5px}
.top .wrap{display:flex;align-items:center;gap:8px}.top .sp{flex:1}

@media (prefers-reduced-motion:no-preference){.sc,.pc,.drow{transition:border-color .15s}}

/* ===== v5 soft redesign ===== */
:root{--shadow:0 1px 2px rgba(34,50,74,.04),0 8px 24px rgba(34,50,74,.07)}
body{background:#F6F1EA;background-image:radial-gradient(60% 40% at 100% 0%,rgba(155,183,212,.28),transparent 70%),radial-gradient(50% 35% at 0% 30%,rgba(123,196,196,.18),transparent 70%),radial-gradient(60% 40% at 100% 85%,rgba(222,205,190,.45),transparent 70%);background-attachment:fixed}
.top{background:rgba(246,241,234,.8);border-bottom:0}
.emo{width:1.25em;height:1.25em;flex:0 0 auto;vertical-align:-.25em;display:inline-block}
.emo.big{width:44px;height:44px}
.chip .emo,.fb .emo{width:16px;height:16px;margin-right:2px}
.fb.on{background:var(--ink);color:#fff}
.shic{width:44px!important;height:44px!important;border-radius:16px!important;background:#fff!important;box-shadow:var(--shadow)}
.shic .emo{width:28px;height:28px}
.sh{margin:30px 0 12px}.sh h2{font-size:21px;letter-spacing:.01em;background:none}
.sh .act{margin-left:auto}
.sic{width:auto!important;height:auto!important;background:none!important;margin-right:6px}.sic .emo{width:22px;height:22px;vertical-align:-5px}
.hero img{height:260px}
.hero .ov h1{font-size:30px;letter-spacing:.02em}
.cd{display:inline-flex;align-items:baseline;gap:6px;background:#fff;border-radius:999px;padding:4px 14px;margin-top:8px;box-shadow:var(--shadow)}
.cd b{font-size:26px}
/* day carousel */
.dcar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 14px;scrollbar-width:none}
.dcar::-webkit-scrollbar{display:none}
.dc{flex:0 0 150px;scroll-snap-align:start;border:0;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:6px;text-align:left;cursor:pointer;position:relative;font:inherit;color:var(--ink)}
.dc .dth{width:100%;height:auto;aspect-ratio:4/3;border-radius:17px}
.dc .dth span{left:8px;bottom:8px;border-radius:999px;padding:0 9px;height:22px;font-size:12px;background:#fff!important}
.dc .dth span::before{content:"DAY ";font-size:10px}
.dcb{display:grid;padding:8px 6px 4px}.dcb b{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}.dcb small{color:var(--muted);font-size:11.5px}
.dcr{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center}.dcr .emo{width:20px;height:20px}
/* boarding pass */
.bp{display:grid;grid-template-columns:1fr 92px;filter:drop-shadow(0 6px 16px rgba(34,50,74,.1))}

function wx(lng,z){return (lng+180)/360*256*Math.pow(2,z);}

  if(line.length>1)g+='<polyline points="'+line.join(' ')+'" fill="none" stroke="#5F8DBE" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" opacity=".75"/>';
  var seen={};
  pts.forEach(function(p){if(!p._xy)return;var k=p._xy[0].toFixed(0)+','+p._xy[1].toFixed(0),off=(seen[k]||0)*14;seen[k]=(seen[k]||0)+1;

  return '<div class="map"><img src="img/map/'+key+'.jpg" alt="'+esc(label)+'地圖" loading="lazy"><svg viewBox="0 0 '+m.w+' '+m.h+'" role="img" aria-label="'+esc(label)+'的位置">'+g+'</svg>'+

}

function geocode(q,center,cb){

    var f=j.features&&j.features[0];if(!f)return cb(null);var c=[f.geometry.coordinates[1],f.geometry.coordinates[0]];

  if(c>=71&&c<=77||c===85||c===86)return['snow','雪'];if(c>=51&&c<=67||c>=80&&c<=82)return['rain','雨'];if(c>=95)return['rain','雷雨'];return['cloud','多雲'];}
function wxFetch(key,qs,cb){

  var L=WXLOC[key];fetch('https://api.open-meteo.com/v1/forecast?latitude='+L.lat+'&longitude='+L.lon+'&timezone=Asia%2FTokyo&'+qs)
    .then(function(r){return r.json();}).then(function(d){try{sessionStorage.setItem(WXV+key,JSON.stringify({t:Date.now(),d:d}));}catch(e){}cb(d);}).catch(function(){cb(null);});

  wxFetch('kawa',q,function(d){WX.kawa=d;fin();});wxFetch('tokyo',q,function(d){WX.tokyo=d;fin();});

function fujiVis(){

  d.hourly.time.forEach(function(t,i){var hh=+t.slice(11,13),day=t.slice(0,10),o=by[day]=by[day]||{am:[],pm:[]};if(hh>=6&&hh<=11)o.am.push(d.hourly.cloud_cover[i]);else if(hh>=12&&hh<=17)o.pm.push(d.hourly.cloud_cover[i]);});

     '<label for="be-n">品名<input id="be-n" value="'+esc(b.n)+'" required></label><label for="be-w">哪裡買<input id="be-w" value="'+esc(b.w||'')+'"></label><label for="be-q">給誰・數量<input id="be-q" value="'+esc(b.q||'')+'"></label>'+
     '<div class="trtools"><span class="sp"></span><button class="ibtn" type="button" data-close>取消</button><button class="btn" type="submit">儲存</button></div></form>');

/* ---------- NOTES ---------- */
var IMGC={},NDRAFT=[];
function imgGet(id,cb){
  if(IMGC[id])return cb(IMGC[id]);
  try{var l=localStorage.getItem('jpimg-'+id);if(l){IMGC[id]=l;return cb(l);}}catch(e){}
  if(!DB)return cb(null);
  DB.collection('photos').doc('jpimg-'+id).get().then(function(d){var v=d.exists&&d.data().d;if(v){IMGC[id]=v;try{localStorage.setItem('jpimg-'+id,v);}catch(e){}}cb(v||null);}).catch(function(){cb(null);});
}
function imgPut(id,data){IMGC[id]=data;try{localStorage.setItem('jpimg-'+id,data);}catch(e){}
  if(!DB)return Promise.reject('offline');return DB.collection('photos').doc('jpimg-'+id).set({d:data});}
function shrink(file,cb){
  var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){
    var max=1280,q=.78,out='';
    for(var k=0;k<8;k++){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<270000)break;if(q>.5)q-=.1;else max=Math.round(max*.8);}
    cb(out.length<290000?out:null);};im.onerror=function(){cb(null);};im.src=rd.result;};rd.onerror=function(){cb(null);};rd.readAsDataURL(file);
}
function noteTime(t){var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}
function rNotes(){
  var N=S.notes.slice().sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)||b.at-a.at;}),tag=LOCAL.ntag||'';
  var tags=['','行前','2/16','2/17','2/18','2/19','2/20','2/21','2/22','2/23'];
  $('#v-list').innerHTML=listSeg()+'<div class="sh">'+shIc('memo')+'<h2>記事本</h2><span class="en">兩人共用</span></div>'+
   '<form class="card ncomp" id="nf"><textarea id="n-t" rows="3" placeholder="記點什麼…（可以貼網址）" aria-label="筆記內容"></textarea>'+
   '<div class="nthumbs" id="n-th"></div>'+
   '<div class="ntools"><label class="ibtn nadd">'+em('camera-with-flash')+'加照片<input type="file" id="n-f" accept="image/*" multiple></label>'+
   '<select id="n-g" aria-label="標記日期">'+tags.map(function(t){return '<option value="'+t+'">'+(t||'不標日期')+'</option>';}).join('')+'</select><span class="sp"></span><button class="btn" type="submit" id="n-s">儲存</button></div></form>'+
   (N.length?'<div class="filters">'+['全部'].concat(tags.slice(1).filter(function(t){return S.notes.some(function(n){return n.g===t;});})).map(function(t){var v=t==='全部'?'':t;return '<button class="fb'+(tag===v?' on':'')+'" data-nt="'+v+'">'+t+'</button>';}).join('')+'</div>':'')+
   '<div class="nlist">'+(N.filter(function(n){return !tag||n.g===tag;}).map(function(n){
     return '<article class="card note'+(n.pin?' pinned':'')+'"><div class="nh">'+(n.g?'<span class="chip mint">'+em('spiral-calendar')+esc(n.g)+'</span>':'')+'<span class="small muted">'+esc(n.by||'')+(n.by?'・':'')+noteTime(n.at)+'</span><span class="sp"></span>'+
     '<button class="ibtn'+(n.pin?' on':'')+'" data-npin="'+n.id+'" aria-label="置頂" aria-pressed="'+!!n.pin+'">'+em('round-pushpin')+'</button><button class="ibtn" data-ned="'+n.id+'" aria-label="編輯">'+ic('edit')+'</button><button class="ibtn" data-ndel="'+n.id+'" aria-label="刪除">'+ic('trash')+'</button></div>'+
     (n.t?'<div class="ntext">'+linkify(n.t)+'</div>':'')+
     ((n.imgs||[]).length?'<div class="nimgs n'+Math.min(n.imgs.length,3)+'">'+n.imgs.map(function(id){return '<button class="nimg" data-img="'+id+'" aria-label="放大照片"><span class="ld"></span></button>';}).join('')+'</div>':'')+'</article>';}).join('')||
     '<div class="empty">'+em('memo','big')+'<p>還沒有筆記。可以記店家資訊、收據、截圖、想法…</p></div>')+'</div>';
  bindSeg();
  var draw=function(){$('#n-th').innerHTML=NDRAFT.map(function(d,i){return '<span class="nth"><img src="'+d+'" alt=""><button type="button" data-ndr="'+i+'" aria-label="移除這張">'+ic('x')+'</button></span>';}).join('');
    $$('[data-ndr]').forEach(function(b){b.onclick=function(){NDRAFT.splice(+b.dataset.ndr,1);draw();};});};draw();
  $('#n-f').onchange=function(){var fs=[].slice.call(this.files||[]);this.value='';if(!fs.length)return;toast('處理照片中…');
    var left=fs.length;fs.forEach(function(f){shrink(f,function(d){if(d)NDRAFT.push(d);else toast('有一張照片太大或無法讀取');if(--left===0)draw();});});};
  $('#n-g').value=tag;
  $('#nf').onsubmit=function(e){e.preventDefault();var t=$('#n-t').value.trim();if(!t&&!NDRAFT.length){toast('寫點字或加張照片');return;}
    if(NDRAFT.length&&!DB){toast('離線中，照片要連上雲端才能存');return;}
    var btn=$('#n-s');btn.disabled=true;btn.textContent='儲存中…';
    var ids=NDRAFT.map(function(){return 'i'+uid()+Math.random().toString(36).slice(2,6);});
    Promise.all(ids.map(function(id,i){return imgPut(id,NDRAFT[i]);})).then(function(){
      S.notes.push({id:'n'+uid(),t:t,imgs:ids,g:$('#n-g').value,at:Date.now(),by:LOCAL.name||''});NDRAFT=[];persist();rNotes();toast('已儲存');
    }).catch(function(){btn.disabled=false;btn.textContent='儲存';toast('照片上傳失敗，請再試一次');});};
  $$('[data-nt]').forEach(function(b){b.onclick=function(){LOCAL.ntag=b.dataset.nt;saveLocal();rNotes();};});
  $$('#v-list [data-img]').forEach(function(b){var id=b.dataset.img;imgGet(id,function(d){if(d)b.innerHTML='<img src="'+d+'" alt="筆記照片">';else b.innerHTML='<span class="small muted">載入不到</span>';});
    b.onclick=function(){if(!IMGC[id])return;$('#fullimg').src=IMGC[id];$('#fullimg').alt='筆記照片';$('#full').classList.add('on');};});
  var find=function(id){return S.notes.filter(function(n){return n.id===id;})[0];};
  $$('[data-npin]').forEach(function(b){b.onclick=function(){var n=find(b.dataset.npin);n.pin=!n.pin;persist();rNotes();};});
  $$('[data-ndel]').forEach(function(b){b.onclick=function(){armDelete(b,function(){var n=find(b.dataset.ndel);S.notes=S.notes.filter(function(x){return x!==n;});persist();
    (n.imgs||[]).forEach(function(id){try{localStorage.removeItem('jpimg-'+id);}catch(e){}if(DB)DB.collection('photos').doc('jpimg-'+id).set({d:''}).catch(function(){});});rNotes();toast('已刪除');});};});
  $$('[data-ned]').forEach(function(b){b.onclick=function(){var n=find(b.dataset.ned);
    openModal('<h3 id="m-title">編輯筆記</h3><form class="form" id="nef"><label for="ne-t">內容<textarea id="ne-t" rows="6">'+esc(n.t||'')+'</textarea></label><label for="ne-g">日期<select id="ne-g">'+tags.map(function(t){return '<option value="'+t+'"'+(t===(n.g||'')?' selected':'')+'>'+(t||'不標日期')+'</option>';}).join('')+'</select></label>'+
      ((n.imgs||[]).length?'<div class="small muted">照片 '+n.imgs.length+' 張（要換照片請刪掉重寫）</div>':'')+'<div class="trtools"><span class="sp"></span><button class="ibtn" type="button" data-close>取消</button><button class="btn" type="submit">儲存</button></div></form>');
    $$('[data-close]').forEach(function(y){y.onclick=closeModal;});
    $('#nef').onsubmit=function(e){e.preventDefault();n.t=$('#ne-t').value.trim();n.g=$('#ne-g').value;persist();closeModal();rNotes();};};});
}
/* ---------- TRANSLATOR ---------- */
function trHtml(){
  var d=LOCAL.trd||'zh',A=d==='zh'?'中文':'日本語',B=d==='zh'?'日本語':'中文';
  return '<div class="tr card" id="tr"><div class="trbar"><span class="trl">'+A+'</span><button class="ibtn round" id="trsw" type="button" aria-label="交換語言">'+ic('swap')+'</button><span class="trl">'+B+'</span></div>'+
  '<div class="trin"><textarea id="trq" rows="3" lang="'+(d==='zh'?'zh-TW':'ja')+'" placeholder="'+(d==='zh'?'輸入中文，或按麥克風直接說':'日本語を入力、またはマイクで話してください')+'"></textarea>'+
  '<div class="trtools"><button class="ibtn round mic" id="trmic" type="button" aria-label="語音輸入">'+ic('mic')+'</button><button class="ibtn" id="trsay0" type="button" aria-label="唸出原文">'+ic('speaker')+'</button><button class="ibtn" id="trclr" type="button">清除</button><span class="sp"></span><button class="btn" id="trgo" type="button">翻譯</button></div></div>'+
  '<div class="trout" id="trout" hidden><div class="trres" id="trres" aria-live="polite"></div><div class="trtools"><button class="ibtn" id="trsay" type="button">'+ic('speaker')+'播放</button><button class="ibtn" id="trslow" type="button">慢速</button><button class="ibtn" id="trcopy" type="button">複製</button><span class="sp"></span><button class="ibtn" id="trbig" type="button">'+ic('expand')+'給對方看</button></div></div>'+
  '<div id="trhist"></div><p class="small muted" style="margin:8px 0 0">翻譯要連網路；播放和麥克風用手機內建語音，第一次用要允許麥克風。</p></div>';
}
function trLang(t){return /[぀-ヿ]/.test(t)?'ja':'zh';}
function speak(t,lang,rate){
  if(!window.speechSynthesis){toast('這支手機不支援播放');return;}
  speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t),L=lang==='ja'?'ja-JP':'zh-TW';u.lang=L;u.rate=rate||1;
  var v=speechSynthesis.getVoices().filter(function(x){return x.lang.replace('_','-').indexOf(L)===0;})[0]||speechSynthesis.getVoices().filter(function(x){return x.lang.indexOf(lang==='ja'?'ja':'zh')===0;})[0];if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function trFetch(q,sl,tl){
  var S={zh:'zh-TW',ja:'ja'};
  return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+S[sl]+'&tl='+S[tl]+'&dt=t&q='+encodeURIComponent(q))
   .then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){return j[0].map(function(x){return x[0];}).join('');})
   .catch(function(){return fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+S[sl]+'|'+S[tl]).then(function(r){return r.json();}).then(function(j){if(!j.responseData||!j.responseData.translatedText)throw 0;return j.responseData.translatedText;});});
}
var TRCUR=null;
function trHist(){
  var el=$('#trhist');if(!el)return;var a=LOCAL.trh||[];
  el.innerHTML=a.length?'<div class="trh"><div class="small muted trhh"><span>最近翻譯</span><button class="ibtn" id="trhc" type="button">清空</button></div>'+a.map(function(x,i){return '<div class="tri"><button class="trit" data-th="'+i+'" type="button"><span>'+esc(x.s)+'</span><b lang="'+(x.tl==='ja'?'ja':'zh-TW')+'">'+esc(x.t)+'</b></button><button class="ibtn round" data-ts="'+i+'" type="button" aria-label="播放">'+ic('speaker')+'</button></div>';}).join('')+'</div>':'';
  $$('#trhist [data-ts]').forEach(function(b){b.onclick=function(){var x=a[+b.dataset.ts];speak(x.t,x.tl);};});
  $$('#trhist [data-th]').forEach(function(b){b.onclick=function(){var x=a[+b.dataset.th];$('#trq').value=x.s;trShow(x);};});
  var c=$('#trhc');if(c)c.onclick=function(){LOCAL.trh=[];saveLocal();trHist();};
}
function trShow(x){TRCUR=x;$('#trout').hidden=false;$('#trres').innerHTML='<span lang="'+(x.tl==='ja'?'ja':'zh-TW')+'">'+esc(x.t)+'</span>';}
function bindTr(){
  if(!$('#tr'))return;var q=$('#trq'),busy=false;
  var go=function(){var t=q.value.trim();if(!t||busy)return;var sl=trLang(t),tl=sl==='zh'?'ja':'zh';
    if(sl!==(LOCAL.trd||'zh')){LOCAL.trd=sl;saveLocal();var bar=$('#tr .trbar').children;bar[0].textContent=sl==='zh'?'中文':'日本語';bar[2].textContent=sl==='zh'?'日本語':'中文';}
    busy=true;$('#trgo').textContent='翻譯中…';$('#trout').hidden=false;$('#trres').innerHTML='<span class="muted">翻譯中…</span>';
    trFetch(t,sl,tl).then(function(res){var x={s:t,t:res,tl:tl};trShow(x);var a=(LOCAL.trh||[]).filter(function(y){return y.s!==t;});a.unshift(x);LOCAL.trh=a.slice(0,12);saveLocal();trHist();})
    .catch(function(){$('#trres').innerHTML='<span class="muted">翻譯失敗，請確認網路後再試一次。</span>';})
    .then(function(){busy=false;$('#trgo').textContent='翻譯';});};
  $('#trgo').onclick=go;
  q.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();go();}};
  $('#trsw').onclick=function(){LOCAL.trd=(LOCAL.trd||'zh')==='zh'?'ja':'zh';saveLocal();var v=q.value;var tr=$('#tr');tr.outerHTML=trHtml();var nq=$('#trq');if(TRCUR){nq.value=TRCUR.t;TRCUR=null;}else nq.value=v;bindTr();};
  $('#trclr').onclick=function(){q.value='';$('#trout').hidden=true;TRCUR=null;q.focus();};
  $('#trsay0').onclick=function(){var t=q.value.trim();if(t)speak(t,trLang(t));};
  $('#trsay').onclick=function(){if(TRCUR)speak(TRCUR.t,TRCUR.tl);};
  $('#trslow').onclick=function(){if(TRCUR)speak(TRCUR.t,TRCUR.tl,.7);};
  $('#trcopy').onclick=function(){if(TRCUR&&navigator.clipboard)navigator.clipboard.writeText(TRCUR.t).then(function(){toast('已複製');});};
  $('#trbig').onclick=function(){if(!TRCUR)return;openModal('<div class="trbig" lang="'+(TRCUR.tl==='ja'?'ja':'zh-TW')+'">'+esc(TRCUR.t)+'</div><div class="small muted" style="margin-top:8px">'+esc(TRCUR.s)+'</div><div class="trtools" style="margin-top:12px"><button class="btn" id="trbsay" type="button">'+ic('speaker')+'播放</button><span class="sp"></span><button class="ibtn" type="button" data-close>關閉</button></div>');
    var b=$('#trbsay');if(b)b.onclick=function(){speak(TRCUR.t,TRCUR.tl);};$$('[data-close]').forEach(function(x){x.onclick=closeModal;});};
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$('#trmic');
  if(!SR){mic.hidden=true;}else mic.onclick=function(){
    if(mic.classList.contains('on')){try{window._rec.stop();}catch(e){}return;}
    var rec=window._rec=new SR();rec.lang=(LOCAL.trd||'zh')==='zh'?'zh-TW':'ja-JP';rec.interimResults=true;
    rec.onresult=function(e){var s='';for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;q.value=s;};
    rec.onend=function(){mic.classList.remove('on');if(q.value.trim())go();};
    rec.onerror=function(e){mic.classList.remove('on');if(e.error==='not-allowed')toast('請允許使用麥克風');};
    mic.classList.add('on');rec.start();};
  if(window.speechSynthesis)speechSynthesis.getVoices();
  trHist();
}

   '<div class="card" style="margin-top:12px"><b class="small">聽懂店員的回答</b><dl class="kv"><dt>入っています</dt><dd>有放</dd><dt>入っていません</dt><dd>沒有放</dd><dt>抜けます</dt><dd>可以拿掉</dd><dt>抜けません</dt><dd>沒辦法拿掉</dd><dt>大丈夫です</dt><dd>沒問題（沒有放）</dd></dl></div>'+
   '<div class="callout peach" style="margin-top:12px">字卡補充寫的是：高湯裡有昆布等海藻也沒關係，或請店家推薦其他餐點。要特別注意的是看得到的海藻：味噌湯的海帶芽、拉麵上的海苔、沙拉、佃煮、飯糰海苔。</div>';
  $$('#v-card [data-ct]').forEach(function(b){b.onclick=function(){LOCAL.ctab=b.dataset.ct;saveLocal();rCard();};});
  $$('#v-card [data-l]').forEach(function(b){b.onclick=function(){LOCAL.lang=b.dataset.l;saveLocal();rCard();};});
  bindTr();
  $('#acard').onclick=function(){$('#fullimg').src=src;$('#fullimg').alt=$('#acard img').alt;$('#full').classList.add('on');};
}

route();
connect();
